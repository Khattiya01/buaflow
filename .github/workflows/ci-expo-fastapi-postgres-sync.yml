name: expo-fastapi-postgres-sync CI

on:
  pull_request:
    paths: ["reference-apps/expo-fastapi-postgres-sync/**"]
  push:
    branches: [main]
    paths: ["reference-apps/expo-fastapi-postgres-sync/**"]
  workflow_dispatch: {}

env:
  DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
  SESSION_SECRET: ci-only-secret-not-used-for-anything-real-0123456789

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: reference-apps/expo-fastapi-postgres-sync/backend/requirements-dev-lock.txt

      - name: Install backend dependencies
        working-directory: reference-apps/expo-fastapi-postgres-sync/backend
        run: |
          pip install -r requirements-dev-lock.txt
          pip install --no-deps -e .

      - name: Backend lint
        working-directory: reference-apps/expo-fastapi-postgres-sync/backend
        run: ruff check app scripts tests

      - name: Backend typecheck
        working-directory: reference-apps/expo-fastapi-postgres-sync/backend
        run: mypy app

      - name: Apply migrations
        working-directory: reference-apps/expo-fastapi-postgres-sync/backend
        run: python -m alembic upgrade head

      - name: Backend unit + integration tests (sync push/pull, conflict resolution, ownership)
        working-directory: reference-apps/expo-fastapi-postgres-sync/backend
        run: pytest

      - name: Backend production dependency audit
        working-directory: reference-apps/expo-fastapi-postgres-sync/backend
        run: pip-audit -r requirements-lock.txt --format json -o ../evidence/pip-audit.json

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            reference-apps/expo-fastapi-postgres-sync/mobile/package-lock.json
            reference-apps/expo-fastapi-postgres-sync/tests/e2e/package-lock.json

      - name: Install mobile dependencies
        working-directory: reference-apps/expo-fastapi-postgres-sync/mobile
        run: npm ci

      - name: Mobile typecheck
        working-directory: reference-apps/expo-fastapi-postgres-sync/mobile
        run: npm run typecheck

      - name: Mobile lint
        working-directory: reference-apps/expo-fastapi-postgres-sync/mobile
        run: npm run lint

      - name: Mobile sync-engine unit tests
        working-directory: reference-apps/expo-fastapi-postgres-sync/mobile
        run: npm test

      - name: Mobile production dependency audit
        working-directory: reference-apps/expo-fastapi-postgres-sync/mobile
        run: npm audit --omit=dev --json > ../evidence/npm-audit-mobile.json

      - name: Install e2e dependencies
        working-directory: reference-apps/expo-fastapi-postgres-sync/tests/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: reference-apps/expo-fastapi-postgres-sync/tests/e2e
        run: npx playwright install --with-deps chromium

      - name: E2E tests (primary flow, accessibility, performance, offline sync)
        working-directory: reference-apps/expo-fastapi-postgres-sync/tests/e2e
        run: npm test

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: reference-apps/expo-fastapi-postgres-sync/evidence/

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Build production image (backend + mobile web export, one deployable image)
        working-directory: reference-apps/expo-fastapi-postgres-sync
        run: docker build -t expo-fastapi-postgres-sync:${{ github.sha }} .

  android:
    # Proves the native mobile build the web export cannot: that mobile/'s React Native
    # source actually compiles into an installable Android binary, not just a web bundle.
    # A debug (unsigned) APK needs no app-store credentials, which Buaflow does not hold or
    # manage — see mobile/eas.json for the documented, credentialed path to a real
    # app-store release build.
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: reference-apps/expo-fastapi-postgres-sync/mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: reference-apps/expo-fastapi-postgres-sync/mobile
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # The action's own default ("tools platform-tools") includes the legacy,
          # long-removed standalone "Android SDK Tools" package — Google dropped it from
          # the SDK repository years ago, so requesting it makes sdkmanager exit non-zero
          # before it even gets to platform-tools. Gradle resolves the actual
          # platform/build-tools versions it needs itself once cmdline-tools +
          # platform-tools are present and licenses are accepted.
          packages: "platform-tools"

      - name: Generate the native Android project (expo prebuild)
        working-directory: reference-apps/expo-fastapi-postgres-sync/mobile
        run: npx expo prebuild --platform android

      - name: Build a debug APK
        working-directory: reference-apps/expo-fastapi-postgres-sync/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: reference-apps/expo-fastapi-postgres-sync/mobile/android/app/build/outputs/apk/debug/app-debug.apk
