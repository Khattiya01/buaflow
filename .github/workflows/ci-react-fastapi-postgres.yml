name: react-fastapi-postgres-crud CI

on:
  pull_request:
    paths: ["reference-apps/react-fastapi-postgres-crud/**"]
  push:
    branches: [main]
    paths: ["reference-apps/react-fastapi-postgres-crud/**"]

env:
  DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
  SESSION_SECRET: ci-only-secret-not-used-for-anything-real-0123456789

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: reference-apps/react-fastapi-postgres-crud/backend/requirements-dev-lock.txt

      - name: Install backend dependencies
        working-directory: reference-apps/react-fastapi-postgres-crud/backend
        run: |
          pip install -r requirements-dev-lock.txt
          pip install --no-deps -e .

      - name: Backend lint
        working-directory: reference-apps/react-fastapi-postgres-crud/backend
        run: ruff check app scripts tests

      - name: Backend typecheck
        working-directory: reference-apps/react-fastapi-postgres-crud/backend
        run: mypy app

      - name: Apply migrations
        working-directory: reference-apps/react-fastapi-postgres-crud/backend
        run: python -m alembic upgrade head

      - name: Backend unit + integration tests
        working-directory: reference-apps/react-fastapi-postgres-crud/backend
        run: pytest

      - name: Backend production dependency audit
        working-directory: reference-apps/react-fastapi-postgres-crud/backend
        run: pip-audit -r requirements-lock.txt --format json -o ../evidence/pip-audit.json

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            reference-apps/react-fastapi-postgres-crud/frontend/package-lock.json
            reference-apps/react-fastapi-postgres-crud/tests/e2e/package-lock.json

      - name: Install frontend dependencies
        working-directory: reference-apps/react-fastapi-postgres-crud/frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: reference-apps/react-fastapi-postgres-crud/frontend
        run: npm run typecheck

      - name: Frontend lint
        working-directory: reference-apps/react-fastapi-postgres-crud/frontend
        run: npm run lint

      - name: Frontend production dependency audit
        working-directory: reference-apps/react-fastapi-postgres-crud/frontend
        run: npm audit --omit=dev --json > ../evidence/npm-audit.json

      - name: Install e2e dependencies
        working-directory: reference-apps/react-fastapi-postgres-crud/tests/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: reference-apps/react-fastapi-postgres-crud/tests/e2e
        run: npx playwright install --with-deps chromium

      - name: E2E tests (primary flow, accessibility, performance)
        working-directory: reference-apps/react-fastapi-postgres-crud/tests/e2e
        run: npm test

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: reference-apps/react-fastapi-postgres-crud/evidence/

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        working-directory: reference-apps/react-fastapi-postgres-crud
        run: docker build -t react-fastapi-postgres-crud:${{ github.sha }} .
