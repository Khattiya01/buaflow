name: nextjs-postgres-crud CI

on:
  # EP-010 — re-run this app's own verification on a cadence, not only when someone
  # touches it. Pinned dependencies rot and advisories are published whether or not
  # anyone edits the code; a weekly red build is how an adopter finds out.
  # (Scheduled runs use the default branch and ignore the path filters below.)
  schedule:
    - cron: "0 17 * * 1"
  pull_request:
    paths: ["reference-apps/nextjs-postgres-crud/**"]
  push:
    branches: [main]
    paths: ["reference-apps/nextjs-postgres-crud/**"]
  workflow_dispatch: {}

env:
  DATABASE_URL: postgresql://app:app@localhost:5432/app
  SESSION_SECRET: ci-only-secret-not-used-for-anything-real-0123456789

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: reference-apps/nextjs-postgres-crud/package-lock.json

      - name: Install dependencies
        working-directory: reference-apps/nextjs-postgres-crud
        run: npm ci

      - name: Typecheck
        working-directory: reference-apps/nextjs-postgres-crud
        run: npm run typecheck

      - name: Lint
        working-directory: reference-apps/nextjs-postgres-crud
        run: npm run lint

      - name: Unit tests
        working-directory: reference-apps/nextjs-postgres-crud
        run: npm test

      - name: Apply migrations
        working-directory: reference-apps/nextjs-postgres-crud
        run: npx prisma migrate deploy

      - name: Integration tests (build + real Postgres)
        working-directory: reference-apps/nextjs-postgres-crud
        run: npm run test:integration

      - name: Install Playwright browsers
        working-directory: reference-apps/nextjs-postgres-crud
        run: npx playwright install --with-deps chromium

      - name: E2E tests (primary flow, accessibility, performance)
        working-directory: reference-apps/nextjs-postgres-crud
        run: npx playwright test

      - name: Production dependency audit
        working-directory: reference-apps/nextjs-postgres-crud
        run: npm run audit:dependencies

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: reference-apps/nextjs-postgres-crud/evidence/

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        working-directory: reference-apps/nextjs-postgres-crud
        run: docker build -t nextjs-postgres-crud:${{ github.sha }} .
