[project]
name = "react-fastapi-postgres-crud-backend"
version = "0.1.0"
description = "Buaflow PP-004 reference app backend (FastAPI + SQLAlchemy + PostgreSQL)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141,<0.142",
  # Pinned explicitly, not left to fastapi's loose starlette>=0.46.0 transitive bound:
  # pip-audit flagged PYSEC-2026-161/248/249/1941/1942/2280/2281 against starlette<1.3.1.
  "starlette>=1.6,<1.7",
  "uvicorn[standard]>=0.32,<0.33",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<3.3",
  "alembic>=1.13,<1.14",
  "pydantic>=2.9,<2.10",
  "pydantic-settings>=2.6,<2.7",
  "itsdangerous>=2.2,<2.3",
  "bcrypt>=4.2,<4.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<8.4",
  "httpx>=0.27,<0.28",
  "mypy>=1.13,<1.14",
  "ruff>=0.7,<0.8",
  "pip-audit>=2.7,<2.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
